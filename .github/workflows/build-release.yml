name: Build Release APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0)'
        required: true
        default: '1.0.1'
jobs:
  build-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Determine Version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - run: |
          mkdir -p apk
          cp app/build/outputs/apk/release/app-release.apk "apk/VoiceMemo-v${{ steps.version.outputs.version }}.apk"
      - uses: softprops/action-gh-release@v1
        with:
          name: "VoiceMemo v${{ steps.version.outputs.version }}"
          files: apk/VoiceMemo-v${{ steps.version.outputs.version }}.apk
          tag_name: ${{ github.ref_name || format('v{0}', steps.version.outputs.version) }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
